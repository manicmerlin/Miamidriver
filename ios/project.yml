# XcodeGen project definition. Generate with:
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# Then open VintageFit.xcodeproj in Xcode.

name: VintageFit
options:
  bundleIdPrefix: app.vintagefit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "Used to photograph clothing tags."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Used to pick a tag photo from your library."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  VintageFit:
    type: application
    platform: iOS
    sources:
      - path: VintageFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vintagefit.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
