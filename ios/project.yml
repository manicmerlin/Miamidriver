# XcodeGen project definition. Generate with:
#   brew install xcodegen
#   cd ios && xcodegen generate
# Then open VintageFit.xcodeproj in Xcode.

name: VintageFit
options:
  bundleIdPrefix: app.vintagefit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VintageFit:
    type: application
    platform: iOS
    sources:
      - path: VintageFit
        excludes:
          - "Resources/Info.plist"
    resources:
      - VintageFit/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vintagefit.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: VintageFit/Resources/Info.plist
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
