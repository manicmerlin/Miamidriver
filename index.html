<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Miami Driver — a Flappy-style South Florida traffic game</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { background: #2a2a2a; image-rendering: pixelated; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    max-width: 100vw; max-height: 100vh; touch-action: none; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: 12px; opacity: .55; letter-spacing: .04em; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="720"></canvas></div>
<div id="hint">SPACE / click / tap to hop &middot; P to pause</div>
<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;

  // ----- game state -----
  const STATE = { READY: 0, PLAY: 1, DEAD: 2, PAUSE: 3 };
  let state = STATE.READY;
  let score = 0;
  let best = +(localStorage.getItem('miamidriver.best') || 0);
  let tick = 0;

  // player = car on the road. Flappy mechanics: gravity + hop.
  const car = {
    x: 110, y: H * 0.5, vy: 0,
    w: 56, h: 34,
    rot: 0,
  };

  const GRAVITY = 0.38;
  const HOP = -7.2;
  const SCROLL = 3.0;   // base scroll speed
  const ROAD_TOP = 90;
  const ROAD_BOTTOM = H - 60;

  // Obstacle catalog — each uses an emoji sprite so we don't need assets.
  // gap = vertical hole the player must fit through (like flappy's pipes).
  // pair = two sprites stacked leaving a gap; solo = one sprite at a y-pos.
  const OBSTACLES = [
    { id:'burning',   label:'Burning Car',        emoji:'\uD83D\uDE97\uD83D\uDD25', kind:'pair', size:72, tag:'random burning car' },
    { id:'ducks',     label:'Duck Family',        emoji:'\uD83E\uDD86\uD83D\uDC23\uD83D\uDC23', kind:'solo', size:60, tag:'duck family crossing' },
    { id:'detour',    label:'ROAD CLOSED',        emoji:'\uD83D\uDEA7', kind:'pair', size:70, tag:'detour — road closed' },
    { id:'cones',     label:'Construction',       emoji:'\uD83D\uDEA7\uD83E\uDDF1', kind:'pair', size:66, tag:'construction zone' },
    { id:'atv',       label:'ATV Takeover',       emoji:'\uD83C\uDFCD\uFE0F\uD83D\uDEF5', kind:'solo', size:58, tag:'ATV & dirtbike raid' },
    { id:'merger',    label:'No-Signal Merger',   emoji:'\uD83D\uDE99', kind:'solo', size:60, tag:'merging without turn signal' },
    { id:'gator',     label:'Gator Crossing',     emoji:'\uD83D\uDC0A', kind:'solo', size:72, tag:'gator on the road' },
    { id:'bso',       label:'BSO Speed Trap',     emoji:'\uD83D\uDE93', kind:'pair', size:70, tag:'BSO in the median' },
  ];

  /** @type {{x:number,type:object,y:number,gap:number,passed:boolean,flash:number}[]} */
  let obstacles = [];
  let lastSpawnX = W + 200;
  let shake = 0;
  let toast = null; // {text, t}

  function setToast(text) { toast = { text, t: 60 }; }

  function reset() {
    car.x = 110; car.y = H * 0.5; car.vy = 0; car.rot = 0;
    obstacles = []; score = 0; tick = 0; lastSpawnX = W + 180; shake = 0;
    toast = null;
  }

  function hop() {
    if (state === STATE.READY) { state = STATE.PLAY; }
    if (state === STATE.DEAD)  { reset(); state = STATE.PLAY; return; }
    if (state === STATE.PAUSE) { state = STATE.PLAY; return; }
    car.vy = HOP;
  }

  function pause() {
    if (state === STATE.PLAY) state = STATE.PAUSE;
    else if (state === STATE.PAUSE) state = STATE.PLAY;
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); hop(); }
    else if (e.key === 'p' || e.key === 'P') { pause(); }
  });
  cvs.addEventListener('mousedown', (e) => { e.preventDefault(); hop(); });
  cvs.addEventListener('touchstart', (e) => { e.preventDefault(); hop(); }, { passive: false });

  // ----- spawning -----
  function difficulty() {
    // ramps up with score
    return {
      speed: SCROLL + Math.min(3.5, score * 0.06),
      gap:   Math.max(150, 230 - score * 2.2),
      gapJitter: 40,
      spacing: Math.max(210, 300 - score * 1.5),
    };
  }

  function spawn() {
    const d = difficulty();
    const type = OBSTACLES[(Math.random() * OBSTACLES.length) | 0];
    const roadH = ROAD_BOTTOM - ROAD_TOP;
    const gap = d.gap + (Math.random() * d.gapJitter - d.gapJitter/2);
    const y = ROAD_TOP + 40 + Math.random() * (roadH - 80);
    obstacles.push({ x: W + 40, type, y, gap, passed:false, flash:0 });
    setToast(type.tag);
  }

  // ----- collision -----
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function obstacleRects(o) {
    // pair = top block + bottom block with vertical gap of `o.gap` centered at o.y
    // solo = single block at o.y
    const half = o.gap / 2;
    const w = o.type.size;
    if (o.type.kind === 'pair') {
      return [
        { x: o.x, y: ROAD_TOP - 10, w, h: (o.y - half) - (ROAD_TOP - 10) },
        { x: o.x, y: o.y + half, w, h: (ROAD_BOTTOM + 10) - (o.y + half) },
      ];
    }
    return [{ x: o.x, y: o.y - w * 0.35, w, h: w * 0.7 }];
  }

  function carRect() {
    return { x: car.x - car.w/2 + 4, y: car.y - car.h/2 + 4, w: car.w - 8, h: car.h - 8 };
  }

  // ----- update -----
  function update() {
    tick++;
    if (state !== STATE.PLAY) return;

    const d = difficulty();

    car.vy += GRAVITY;
    car.y += car.vy;
    car.rot = Math.max(-0.35, Math.min(0.8, car.vy / 14));

    // road boundaries
    if (car.y - car.h/2 < ROAD_TOP)    { car.y = ROAD_TOP + car.h/2; car.vy = 0; }
    if (car.y + car.h/2 > ROAD_BOTTOM) { die('Ran into the shoulder.'); }

    // spawn loop
    lastSpawnX -= d.speed;
    if (lastSpawnX < W - d.spacing) { spawn(); lastSpawnX = W + 40; }

    for (const o of obstacles) {
      o.x -= d.speed;
      if (o.flash > 0) o.flash--;
      if (!o.passed && o.x + o.type.size < car.x) {
        o.passed = true; score++;
        o.flash = 10;
      }
    }
    obstacles = obstacles.filter(o => o.x > -120);

    // collisions
    const cr = carRect();
    for (const o of obstacles) {
      for (const r of obstacleRects(o)) {
        if (rectsOverlap(cr, r)) { die(deathLine(o.type)); return; }
      }
    }

    if (toast) { toast.t--; if (toast.t <= 0) toast = null; }
    if (shake > 0) shake *= 0.85;
  }

  function deathLine(t) {
    switch (t.id) {
      case 'burning': return 'Another I-95 rolling bonfire.';
      case 'ducks':   return 'Duck family right-of-way.';
      case 'detour':  return 'ROAD CLOSED. No warning. Classic.';
      case 'cones':   return 'Eternal construction strikes again.';
      case 'atv':     return 'Ran over by the wheelie takeover.';
      case 'merger':  return 'He didn\u2019t signal. He never signals.';
      case 'gator':   return 'That gator had the right of way.';
      case 'bso':     return 'Pulled over by BSO. Have a nice day.';
      default:        return 'Welcome to South Florida.';
    }
  }

  function die(msg) {
    if (state === STATE.DEAD) return;
    state = STATE.DEAD;
    shake = 18;
    toast = { text: msg, t: 9999 };
    if (score > best) { best = score; localStorage.setItem('miamidriver.best', best); }
  }

  // ----- rendering -----
  function drawRoad() {
    // sky / horizon
    const grd = ctx.createLinearGradient(0, 0, 0, ROAD_TOP);
    grd.addColorStop(0, '#ff8b57');
    grd.addColorStop(1, '#ffd59e');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, ROAD_TOP);

    // skyline silhouette
    ctx.fillStyle = '#1b2236';
    for (let i = 0; i < 10; i++) {
      const bx = (i * 56 - (tick * 0.3) % 56);
      const bh = 18 + ((i * 37) % 26);
      ctx.fillRect(bx, ROAD_TOP - bh, 40, bh);
    }

    // palm silhouettes
    ctx.fillStyle = '#0f1a2a';
    for (let i = 0; i < 5; i++) {
      const px = ((i * 110) - (tick * 0.6)) % (W + 120) - 60;
      ctx.fillRect(px + 18, ROAD_TOP - 44, 4, 44);
      ctx.beginPath();
      ctx.arc(px + 20, ROAD_TOP - 44, 14, 0, Math.PI*2);
      ctx.fill();
    }

    // shoulder grass
    ctx.fillStyle = '#234d2a';
    ctx.fillRect(0, ROAD_TOP, W, 14);
    ctx.fillRect(0, ROAD_BOTTOM - 14, W, 14);

    // asphalt
    ctx.fillStyle = '#2b2b2f';
    ctx.fillRect(0, ROAD_TOP + 14, W, ROAD_BOTTOM - ROAD_TOP - 28);

    // lane markers (scrolling dashes)
    ctx.fillStyle = '#f5d145';
    const lanes = 3;
    for (let l = 1; l < lanes; l++) {
      const y = ROAD_TOP + 14 + ((ROAD_BOTTOM - ROAD_TOP - 28) * l / lanes) - 2;
      const dash = 30, gap = 22;
      const off = (tick * difficulty().speed) % (dash + gap);
      for (let x = -off; x < W; x += dash + gap) {
        ctx.fillRect(x, y, dash, 4);
      }
    }

    // white edge lines
    ctx.fillStyle = '#e6e6e6';
    ctx.fillRect(0, ROAD_TOP + 14, W, 2);
    ctx.fillRect(0, ROAD_BOTTOM - 16, W, 2);
  }

  function drawEmoji(text, x, y, size) {
    ctx.save();
    ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawCar() {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.rot);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0, car.h/2 + 6, car.w/2, 5, 0, 0, Math.PI*2); ctx.fill();
    // emoji car body
    drawEmoji('\uD83C\uDFCE\uFE0F', 0, 0, 48);
    ctx.restore();
  }

  function drawObstacle(o) {
    const w = o.type.size;
    if (o.type.kind === 'pair') {
      // two stacked emojis framing the gap
      const topY = (ROAD_TOP + (o.y - o.gap/2)) / 2;
      const botY = (ROAD_BOTTOM + (o.y + o.gap/2)) / 2;
      // warning barrier bars behind the emoji for readability
      ctx.fillStyle = o.flash ? 'rgba(255,240,120,.85)' : 'rgba(255,200,60,.18)';
      ctx.fillRect(o.x - w/2, ROAD_TOP + 14, w, (o.y - o.gap/2) - (ROAD_TOP + 14));
      ctx.fillRect(o.x - w/2, o.y + o.gap/2, w, (ROAD_BOTTOM - 16) - (o.y + o.gap/2));
      // diagonal hazard stripes
      ctx.save();
      ctx.strokeStyle = 'rgba(20,20,20,.7)'; ctx.lineWidth = 3;
      for (let s = -40; s < 300; s += 14) {
        ctx.beginPath();
        ctx.moveTo(o.x - w/2 + s, ROAD_TOP + 14);
        ctx.lineTo(o.x - w/2 + s - 40, ROAD_BOTTOM - 16);
        ctx.stroke();
      }
      ctx.restore();
      drawEmoji(o.type.emoji, o.x, topY, w * 0.7);
      drawEmoji(o.type.emoji, o.x, botY, w * 0.7);
    } else {
      if (o.flash) {
        ctx.fillStyle = 'rgba(255,240,120,.8)';
        ctx.beginPath(); ctx.arc(o.x, o.y, w*0.6, 0, Math.PI*2); ctx.fill();
      }
      drawEmoji(o.type.emoji, o.x, o.y, w);
    }
  }

  function drawHUD() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 42px system-ui,Arial';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.strokeText(String(score), W/2, 52);
    ctx.fillText(String(score), W/2, 52);

    ctx.font = '12px system-ui,Arial';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillText(`BEST ${best}`, 10, 20);
    ctx.textAlign = 'right';
    ctx.fillText('MIAMI DRIVER', W - 10, 20);
    ctx.restore();

    if (toast) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold 16px system-ui,Arial';
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      const tw = ctx.measureText(toast.text).width + 24;
      ctx.fillRect(W/2 - tw/2, 70, tw, 26);
      ctx.fillStyle = '#ffe98a';
      ctx.fillText(toast.text, W/2, 88);
      ctx.restore();
    }
  }

  function drawOverlay() {
    if (state === STATE.READY) {
      panel([
        { t: 'MIAMI DRIVER', size: 30, color: '#ffe98a' },
        { t: 'dodge South Florida', size: 16 },
        { t: 'SPACE / tap to hop', size: 14 },
        { t: 'P to pause', size: 12, color: 'rgba(255,255,255,.6)' },
      ]);
    } else if (state === STATE.PAUSE) {
      panel([{ t: 'PAUSED', size: 28, color: '#ffe98a' },
             { t: 'press P to resume', size: 14 }]);
    } else if (state === STATE.DEAD) {
      panel([
        { t: 'GAME OVER', size: 30, color: '#ff8888' },
        { t: toast ? toast.text : '', size: 14, color: '#ffe98a' },
        { t: `score ${score}  \u2022  best ${best}`, size: 16 },
        { t: 'SPACE / tap to retry', size: 13, color: 'rgba(255,255,255,.75)' },
      ]);
    }
  }

  function panel(lines) {
    const pw = 320, ph = 40 + lines.length * 28;
    const px = W/2 - pw/2, py = H/2 - ph/2;
    ctx.save();
    ctx.fillStyle = 'rgba(10,14,28,.82)';
    ctx.strokeStyle = 'rgba(255,255,255,.18)';
    ctx.lineWidth = 2;
    roundRect(px, py, pw, ph, 14, true, true);
    ctx.textAlign = 'center';
    let y = py + 36;
    for (const l of lines) {
      ctx.fillStyle = l.color || '#fff';
      ctx.font = `${l.size >= 22 ? 'bold ' : ''}${l.size}px system-ui,Arial`;
      ctx.fillText(l.t, W/2, y);
      y += 28;
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  // ----- main loop -----
  function frame() {
    update();
    ctx.save();
    if (shake > 0.5) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawRoad();
    for (const o of obstacles) drawObstacle(o);
    drawCar();
    ctx.restore();
    drawHUD();
    drawOverlay();
    requestAnimationFrame(frame);
  }

  reset();
  frame();
})();
</script>
</body>
</html>
